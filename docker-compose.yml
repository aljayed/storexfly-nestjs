services:
  # The API itself runs on the host (pnpm start:prod) and reads .env directly,
  # including the platform-admin console credentials (PLATFORM_ADMIN_EMAIL /
  # PLATFORM_ADMIN_PASSWORD / PLATFORM_JWT_SECRET). If the API is ever moved
  # into compose, pass them through like so:
  #
  #   api:
  #     environment:
  #       PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@storexfly.com}
  #       PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?set in .env}
  #       PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:?set in .env}
  #       PLATFORM_JWT_EXPIRES_IN: ${PLATFORM_JWT_EXPIRES_IN:-12h}

  postgres:
    image: postgres:16-alpine
    container_name: storexfly_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-storexfly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storexfly}
      POSTGRES_DB: ${POSTGRES_DB:-storexfly}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - storexfly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-storexfly} -d ${POSTGRES_DB:-storexfly}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  storexfly_pgdata:
    name: storexfly_pgdata
